[project]
name = "rs2wapy"
dynamic = ["version"]
description = "Rising Storm 2: Vietnam WebAdmin Python Interface"
readme = "README.md"
requires-python = ">=3.12"
license-files = { paths = ["LICENSE"] }
keywords = ["automation webadmin ue3 rcon"]
authors = [
    { name = "Tuomo Kriikkula", email = "tuokri@tuta.io" },
]

dependencies = [
    "beautifulsoup4>=4.15.0",
    "cachetools>=7.2.0",
    "httpx2>=2.13.1",
    "loguru>=0.7.3",
    "regex>=2026.9.10",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# https://github.com/dependabot/dependabot-core/issues/12340
[tool.hatch.version.raw-options]
fallback_version = "0.0.0-unknown"

[tool.hatch.build.hooks.version]
path = "rs2wapy/_version.py"

[dependency-groups]
dev = [
    "genbadge[coverage,tests]>=1.1.3",
    "hatch>=1.16.5",
    "mypy>=1.19.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-loguru>=0.4.0",
    "pytest-timeout>=2.4.0",
    "pytest>=9.0.3",
    "ruff>=0.15.5",
    "uv-dynamic-versioning>=0.13.0",
]

[tool.hatch.build.targets.wheel]
exclude = [
    "rs2wapy/tests"
]

[tool.mypy]
ignore_missing_imports = true

[tool.mypy-rs2wapy._version]
ignore_errors = true

[tool.mypy-rs2wapy.utils.caching]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "pytest_loguru.*",
]
ignore_missing_imports = true
