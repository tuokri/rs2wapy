<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Debug panel{% endblock %} · RS2 WebAdmin mock</title>
    <link rel="stylesheet" href="{{ debug_base_path }}static/css/debug.css">
    <script src="{{ debug_base_path }}static/vendor/htmx/htmx.js" defer></script>
  </head>
  <body>
    <header class="command-bar">
      <a class="brand" href="{{ debug_base_path }}" aria-label="RS2 WebAdmin mock debug overview">
        <span class="brand-kicker">Rising Storm 2 · Vietnam</span>
        <span class="brand-name">Mock Server Control Panel</span>
      </a>
      <div class="command-bar-meta">
        <span class="environment-badge"><span aria-hidden="true">●</span> Development only</span>
        <span class="command-context">{{ server.map_name }} <span aria-hidden="true">//</span> {{ server.game_type }}</span>
      </div>
    </header>
    <div class="app-layout">
      <nav aria-label="Debug sections">
        <p class="nav-title">WebAdmin mock</p>
        <p class="nav-label">Operations</p>
        <a href="{{ debug_base_path }}" {% if active_page == "dashboard" %}aria-current="page"{% endif %}>Overview</a>
        <a href="{{ debug_base_path }}players" {% if active_page == "players" %}aria-current="page"{% endif %}>Players</a>
        <p class="nav-label">Inspection</p>
        <a href="{{ debug_base_path }}state" {% if active_page == "state" %}aria-current="page"{% endif %}>Runtime state</a>
        <a href="{{ debug_base_path }}requests" {% if active_page == "requests" %}aria-current="page"{% endif %}>Request log</a>
      </nav>
      <main>{% block content %}{% endblock %}</main>
    </div>
  </body>
</html>
