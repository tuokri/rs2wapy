[project]
name = "webadmin-api-docs"
version = "0.1.0"
description = "Helper utilities for building Rising Storm 2: Vietnam WebAdmin server mocking tools."
readme = "README.md"
authors = [
    { name = "Tuomo Kriikkula", email = "tuokri@tuta.io" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "httpx2>=2.13.1",
    "loguru>=0.7.3",
]

[project.scripts]
webadmin-api-docs = "webadmin_api_docs:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.0.2",
    "ruff>=0.16.9",
]

[tool.mypy]
python_version = "3.14"
files = ["src", "tools"]
exclude = ["^\\.venv/"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv"]
